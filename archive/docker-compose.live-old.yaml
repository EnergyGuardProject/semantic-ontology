services:
  neo4j:
    image: neo4j:2025.10.1-bullseye
    container_name: neo4j
    restart: always
    networks:
      - nginxproxy_energyguard_net
    ports:
      - "127.0.0.1:7474:7474"  # HTTP interface
      - "127.0.0.1:7687:7687"  # Bolt interface
    volumes:
      - ./runtime/live/data:/data
      - ./runtime/live/logs:/logs
      - ./import:/import
      - ./runtime/plugins:/plugins
    environment:
      NEO4J_AUTH: "neo4j/REDACTED"
      NEO4J_dbms_security_procedures_unrestricted: 'apoc.*,n10s.*' 
      NEO4J_dbms_connector_bolt_advertised__address: energyguard.epu.ntua.gr:7687
      NEO4J_dbms_connector_http_advertised__address: energyguard.epu.ntua.gr:7474
      # NEO4J_ACCEPT_LICENSE_AGREEMENT: "yes"

networks:
  nginxproxy_energyguard_net:
    external: true
