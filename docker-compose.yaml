# Neo4j instance holding the EnergyGuard ontology (ontology built by scripts/ontology/build_all_pilots_owl.py).
#
#   docker compose up -d
#   Browser: http://localhost:7476   Bolt: bolt://localhost:7689   (localhost only)
#   from your own machine: ssh -L 7476:localhost:7476 -L 7689:localhost:7689 <server>
#   load / reload the ontology: scripts/neo4j/reload_ontology.sh
name: neo4j-ontology   # own compose project name: never touches the old live "neo4j" container
services:
  neo4j-ontology:
    image: neo4j:2025.10.1-bullseye
    container_name: neo4j-ontology
    restart: unless-stopped
    ports:
      - "127.0.0.1:7476:7474"  # HTTP / Browser
      - "127.0.0.1:7689:7687"  # Bolt
    volumes:
      - ./runtime/data:/data
      - ./runtime/logs:/logs
      - ./import:/import
      - ./runtime/plugins:/plugins
    environment:
      NEO4J_AUTH: "neo4j/REDACTED"
      NEO4J_dbms_security_procedures_unrestricted: "apoc.*,n10s.*"
      NEO4J_dbms_security_procedures_allowlist: "apoc.*,n10s.*,db.*,dbms.*"
      NEO4J_server_directories_import: "/import"
      NEO4J_server_bolt_advertised__address: "localhost:7689"
      NEO4J_server_http_advertised__address: "localhost:7476"
      NEO4J_server_memory_heap_initial__size: "512m"
      NEO4J_server_memory_heap_max__size: "1g"
      NEO4J_server_memory_pagecache_size: "512m"
