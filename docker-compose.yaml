# Two Neo4j instances holding the EnergyGuard ontology:
#   neo4j-ontology  private, writable, with the plugins; the ontology is loaded here (reachable only from this machine)
#   neo4j-public    a read-only copy for everyone, with a shared password and no plugins; refresh it with utils/neo4j/refresh_public.sh
#
#   docker compose up -d
#   Browser: http://localhost:7474   Bolt: bolt://localhost:7687   (bound to localhost)
#   public:  https://ontology.energy-guard.eu  (nginx-proxy-manager -> host "neo4j-public", port 7474; Browser at /browser/)
#   from your own machine: ssh -L 7474:localhost:7474 -L 7687:localhost:7687 <server>
#   load / reload the ontology: utils/neo4j/reload_ontology.sh
name: neo4j-ontology
services:
  neo4j-ontology:
    image: neo4j:2025.10.1-bullseye
    container_name: neo4j-ontology
    restart: unless-stopped
    ports:
      - "127.0.0.1:7474:7474"  # HTTP / Browser
      - "127.0.0.1:7687:7687"  # Bolt
    networks:
      default:
      nginxproxy_energyguard_net:
        aliases:
          - neo4j               # the name nginx-proxy-manager forwards ontology.energy-guard.eu to
    volumes:
      - ./runtime/data:/data
      - ./runtime/logs:/logs
      - ./ontology:/import:ro   # n10s reads ontology/all_pilots.owl as file:///import/all_pilots.owl
      - ./runtime/plugins:/plugins
    environment:
      NEO4J_AUTH: "neo4j/${NEO4J_PASSWORD:?set NEO4J_PASSWORD in .env}"   # only used when the database is first created
      NEO4J_dbms_security_procedures_unrestricted: "apoc.*,n10s.*"
      NEO4J_dbms_security_procedures_allowlist: "apoc.*,n10s.*,db.*,dbms.*"
      NEO4J_server_directories_import: "/import"
      NEO4J_server_bolt_advertised__address: "energyguard.epu.ntua.gr:7687"
      NEO4J_server_http_advertised__address: "energyguard.epu.ntua.gr:7474"
      NEO4J_server_memory_heap_initial__size: "512m"
      NEO4J_server_memory_heap_max__size: "1g"
      NEO4J_server_memory_pagecache_size: "512m"


  neo4j-public:
    image: neo4j:2025.10.1-bullseye
    container_name: neo4j-public
    restart: unless-stopped
    ports:
      - "127.0.0.1:7475:7474"  # for testing from this machine only
      - "127.0.0.1:7688:7687"
    networks:
      default:
      nginxproxy_energyguard_net:
        aliases:
          - neo4j-public        # the name nginx-proxy-manager forwards ontology.energy-guard.eu to
    volumes:
      - ./runtime/public-data:/data
      - ./runtime/public-logs:/logs
    environment:
      NEO4J_AUTH: "neo4j/${NEO4J_PUBLIC_PASSWORD:?set NEO4J_PUBLIC_PASSWORD in .env}"
      NEO4J_server_databases_read__only: "neo4j"          # nobody can change the graph
      # no plugins are mounted, and only the procedures the Browser needs are allowed
      NEO4J_dbms_security_procedures_allowlist: "db.*,dbms.components,dbms.clientConfig,dbms.showCurrentUser,dbms.procedures,dbms.functions"
      NEO4J_db_transaction_timeout: "20s"                  # a runaway query is stopped
      NEO4J_dbms_memory_transaction_total_max: "512m"
      NEO4J_server_bolt_advertised__address: "ontology.energy-guard.eu:443"
      NEO4J_server_http_advertised__address: "ontology.energy-guard.eu:443"
      NEO4J_server_memory_heap_initial__size: "256m"
      NEO4J_server_memory_heap_max__size: "512m"
      NEO4J_server_memory_pagecache_size: "128m"

networks:
  nginxproxy_energyguard_net:
    external: true
