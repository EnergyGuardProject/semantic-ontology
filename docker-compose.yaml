# Neo4j instance holding the EnergyGuard ontology (ontology built by scripts/ontology/build_all_pilots_owl.py).
#
#   docker compose up -d
#   Browser: http://localhost:7474   Bolt: bolt://localhost:7687   (bound to localhost)
#   public:  https://neo4j.energy-guard.eu  (nginx-proxy-manager -> host "neo4j", port 7474)
#   from your own machine: ssh -L 7474:localhost:7474 -L 7687:localhost:7687 <server>
#   load / reload the ontology: scripts/neo4j/reload_ontology.sh
name: neo4j-ontology
services:
  neo4j-ontology:
    image: neo4j:2025.10.1-bullseye
    container_name: neo4j-ontology
    restart: unless-stopped
    ports:
      - "127.0.0.1:7474:7474"  # HTTP / Browser
      - "127.0.0.1:7687:7687"  # Bolt
    networks:
      default:
      nginxproxy_energyguard_net:
        aliases:
          - neo4j               # the name nginx-proxy-manager forwards neo4j.energy-guard.eu to
    volumes:
      - ./runtime/data:/data
      - ./runtime/logs:/logs
      - ./ontology:/import:ro   # n10s reads ontology/all_pilots.owl as file:///import/all_pilots.owl
      - ./runtime/plugins:/plugins
    environment:
      NEO4J_AUTH: "neo4j/${NEO4J_PASSWORD:?set NEO4J_PASSWORD in .env}"   # only used when the database is first created
      NEO4J_dbms_security_procedures_unrestricted: "apoc.*,n10s.*"
      NEO4J_dbms_security_procedures_allowlist: "apoc.*,n10s.*,db.*,dbms.*"
      NEO4J_server_directories_import: "/import"
      NEO4J_server_bolt_advertised__address: "energyguard.epu.ntua.gr:7687"
      NEO4J_server_http_advertised__address: "energyguard.epu.ntua.gr:7474"
      NEO4J_server_memory_heap_initial__size: "512m"
      NEO4J_server_memory_heap_max__size: "1g"
      NEO4J_server_memory_pagecache_size: "512m"

networks:
  nginxproxy_energyguard_net:
    external: true
